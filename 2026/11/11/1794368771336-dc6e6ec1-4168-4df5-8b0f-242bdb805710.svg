<svg xmlns="http://www.w3.org/2000/svg" width="750" height="1610" viewBox="0 0 750 1610" role="img" aria-labelledby="routing-title routing-desc">
<title id="routing-title">请求分给谁，会改变重复计算</title>
<desc id="routing-desc">两个相同模型的独立副本 A 与 B 仅保存本地前缀缓存，初始均没有公共前缀 P。R1 处理完成后 R2 才到，两条请求共享前缀 P，但问题不同。普通轮询把 R1 分给 A，R2 分给 B，使 P 计算两次；缓存感知路由把二者都分给 A，使 P 只计算一次。这里只比较公共前缀，新问题与后续生成仍需计算。</desc>
<rect x="0" y="0" width="750" height="1610" rx="0" fill="#FFF9EF" stroke="none" stroke-width="2" />
<defs><marker id="routing-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L8 4.5 L0 9 Z" fill="#647889"/></marker></defs>
<rect x="40" y="40" width="9" height="55" rx="4" fill="#138A84" stroke="none" stroke-width="2" />
<text x="70" y="82" font-size="40" font-family="Alibaba PuHuiTi, Alibaba PuHuiTi 3.0, PingFang SC, sans-serif" font-weight="700" fill="#17324D" text-anchor="start" >请求分给谁，会改变重复计算</text>
<text x="40" y="143" font-size="34" font-family="Alibaba PuHuiTi, Alibaba PuHuiTi 3.0, PingFang SC, sans-serif" font-weight="400" fill="#647889" text-anchor="start" >顺序到达 · 本地缓存 · 过程示意</text>
<text x="40" y="206" font-size="33" font-family="Alibaba PuHuiTi, Alibaba PuHuiTi 3.0, PingFang SC, sans-serif" font-weight="400" fill="#17324D" text-anchor="start" >同一模型的两个副本，起初均无 P。</text>
<text x="40" y="255" font-size="33" font-family="Alibaba PuHuiTi, Alibaba PuHuiTi 3.0, PingFang SC, sans-serif" font-weight="400" fill="#17324D" text-anchor="start" >R1 处理完成后，R2 才到达。</text>
