<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1160" viewBox="0 0 900 1160">
<rect x="0" y="0" width="900" height="1160" rx="0" fill="#FBFAF6"/>
<text x="48" y="80" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="49" fill="#183642" font-weight="700" text-anchor="start">发现失败后，怎样继续？</text>
<text x="48" y="143" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="34" fill="#5C7178" font-weight="400" text-anchor="start">过程示意 · 12 秒循环，不代表实际耗时</text>
<rect x="160" y="195" width="692" height="144" rx="20" fill="#FFFFFF" stroke="#DCE4DF" stroke-width="3"/>
