<text x="197" y="528" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="34" fill="#5C7178" font-weight="400" text-anchor="start">核对浏览器的下载结果</text>
<rect x="160" y="639" width="692" height="144" rx="20" fill="#FFFFFF" stroke="#DCE4DF" stroke-width="3"/>
