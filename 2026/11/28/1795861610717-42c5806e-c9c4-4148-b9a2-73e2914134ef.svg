<rect id="lh-run-active" x="160" y="195" width="692" height="144" rx="20" fill="none" stroke="#087F78" stroke-width="7" opacity="0"><animate attributeName="opacity" values="1;0;0;0;0;0;1" keyTimes="0;0.16;0.33;0.50;0.67;0.90;1" calcMode="discrete" dur="12s" begin="0s" repeatCount="indefinite"/></rect>
<rect id="lh-check-active" x="160" y="417" width="692" height="144" rx="20" fill="none" stroke="#087F78" stroke-width="7" opacity="0"><animate attributeName="opacity" values="0;1;0;1;0;0;0" keyTimes="0;0.16;0.33;0.50;0.67;0.90;1" calcMode="discrete" dur="12s" begin="0s" repeatCount="indefinite"/></rect>
<rect id="lh-repair-active" x="160" y="639" width="692" height="144" rx="20" fill="none" stroke="#BD622C" stroke-width="7" opacity="0"><animate attributeName="opacity" values="0;0;1;0;0;0;0" keyTimes="0;0.16;0.33;0.50;0.67;0.90;1" calcMode="discrete" dur="12s" begin="0s" repeatCount="indefinite"/></rect>
<rect id="lh-save-active" x="160" y="899" width="692" height="144" rx="20" fill="none" stroke="#087F78" stroke-width="7" opacity="0"><animate attributeName="opacity" values="0;0;0;0;1;1;0" keyTimes="0;0.16;0.33;0.50;0.67;0.90;1" calcMode="discrete" dur="12s" begin="0s" repeatCount="indefinite"/></rect>
<g id="lh-failed" opacity="0"><animate attributeName="opacity" values="0;1;0;0;0;0;0" keyTimes="0;0.16;0.33;0.50;0.67;0.90;1" calcMode="discrete" dur="12s" begin="0s" repeatCount="indefinite"/>
<rect x="538" y="436" width="265" height="48" rx="10" fill="#FFF0E2"/>
<text x="670.5" y="471" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="31" fill="#BD622C" font-weight="650" text-anchor="middle">下载失败</text>
</g>
<g id="lh-passed" opacity="0"><animate attributeName="opacity" values="0;0;0;1;1;1;0" keyTimes="0;0.16;0.33;0.50;0.67;0.90;1" calcMode="discrete" dur="12s" begin="0s" repeatCount="indefinite"/>
<rect x="538" y="436" width="265" height="48" rx="10" fill="#E4F1EC"/>
<text x="670.5" y="471" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="31" fill="#087F78" font-weight="650" text-anchor="middle">重测通过</text>
</g>
<text x="450" y="1110" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="39" fill="#183642" font-weight="600" text-anchor="middle">完成声明，要跟在验收证据之后。</text>
</svg>