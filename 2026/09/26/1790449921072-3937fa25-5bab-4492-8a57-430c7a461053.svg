<svg width="900" height="383" viewBox="0 0 900 383" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- Background Gradient: Sterile, deep manufacturing environment -->
        <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0f172a" />
            <stop offset="100%" stop-color="#1e3a8a" />
        </linearGradient>

        <!-- Glow effect for the eccentricity (noise) representation -->
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="8" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>

        <!-- Rotor Gradient -->
        <radialGradient id="rotor-grad" cx="50%" cy="50%" r="50%">
            <stop offset="60%" stop-color="#1e293b" />
            <stop offset="100%" stop-color="#334155" />
        </radialGradient>
        
        <!-- VPI Resin / Precision Gradient -->
        <linearGradient id="vpi-grad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.1"/>
            <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0.8"/>
        </linearGradient>
    </defs>

    <!-- Base Background -->
    <rect width="900" height="383" fill="url(#bg-grad)" />

    <!-- Technical Grid Background for Engineering Context -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
        <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.05" />
    </pattern>
    <rect width="900" height="383" fill="url(#grid)" />

    <!-- ========================================== -->
    <!-- VISUAL METAPHOR 1: The Motor & Tolerances  -->
    <!-- ========================================== -->
    <g transform="translate(650, 191.5)">
        <!-- Outer Stator Envelope -->
        <circle cx="0" cy="0" r="150" fill="none" stroke="#475569" stroke-width="1" />
        <circle cx="0" cy="0" r="140" fill="none" stroke="#3b82f6" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="8 4" />
        
        <!-- The "Eccentricity & Noise" Ring (Static Eccentricity Representation) -->
        <ellipse cx="-8" cy="5" rx="105" ry="98" fill="none" stroke="#ef4444" stroke-width="3" filter="url(#glow)" stroke-opacity="0.7" />
        
        <!-- The "Precision & Balancing" Ring (G1.0 Representation) -->
        <circle cx="0" cy="0" r="102" fill="none" stroke="#10b981" stroke-width="2" />
        
        <!-- The Rotor -->
        <circle cx="0" cy="0" r="90" fill="url(#rotor-grad)" stroke="#64748b" stroke-width="2" />
        <circle cx="0" cy="0" r="15" fill="#0f172a" stroke="#94a3b8" stroke-width="2" />
        <line x1="-15" y1="0" x2="15" y2="0" stroke="#94a3b8" stroke-width="1" />
        <line x1="0" y1="-15" x2="0" y2="15" stroke="#94a3b8" stroke-width="1" />

        <!-- VPI Solidification Concept (Resin binding the stator) -->
        <path d="M -130 0 A 130 130 0 0 1 130 0 A 130 130 0 0 1 -130 0" fill="none" stroke="url(#vpi-grad)" stroke-width="12" stroke-dasharray="20 10" />
    </g>

    <!-- ========================================== -->
    <!-- VISUAL METAPHOR 2: Acoustic Waveform       -->
    <!-- ========================================== -->
    <!-- Chaotic High-Frequency Noise (Mechanical/Aerodynamic) -->
    <path d="M 0 250 Q 30 100, 60 280 T 120 150 T 180 300 T 240 180 T 300 270 T 360 210 T 420 250" fill="none" stroke="#ef4444" stroke-width="2" stroke-opacity="0.4" />
    
    <!-- Medium Frequency Electromagentic Noise -->
    <path d="M 0 220 Q 40 150, 80 260 T 160 170 T 240 240 T 320 190 T 400 220 L 500 220" fill="none" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.6" />

    <!-- The Transformation: Smooth, low-entropy laminar line (Post-Process Control) -->
    <path d="M 0 191.5 Q 80 160, 160 210 T 320 191.5 L 548 191.5" fill="none" stroke="#10b981" stroke-width="4" filter="url(#glow)"/>

    <!-- ========================================== -->
    <!-- TYPOGRAPHY & LAYOUT                        -->
    <!-- ========================================== -->
    <!-- Top left indicator -->
    <rect x="50" y="60" width="40" height="4" fill="#38bdf8" />
    <text x="100" y="66" fill="#94a3b8" font-size="14" font-family="sans-serif" letter-spacing="2">公众号：机械电气电机杂谈 微信：xiamu_design</text>

    <!-- Main Title -->
    <text x="50" y="140" fill="#cbd5e1" font-size="28" font-family="sans-serif" letter-spacing="3">电机降噪的</text>
    <text x="50" y="210" fill="#ffffff" font-size="64" font-weight="900" font-family="sans-serif" letter-spacing="1">工艺控制</text>
    <text x="50" y="280" fill="#38bdf8" font-size="48" font-weight="bold" font-family="sans-serif" letter-spacing="2">与制造策略</text>

    <!-- Subtitle / Meta Information -->
    <g transform="translate(50, 330)">
        <rect x="0" y="-15" width="3" height="18" fill="#10b981" />
        <text x="15" y="0" fill="#94a3b8" font-size="15" font-family="sans-serif" letter-spacing="1">从毛刺到动平衡的物理重构</text>
    </g>

    <!-- Decorative Interface Elements -->
    <circle cx="850" cy="50" r="3" fill="#38bdf8" />
    <circle cx="850" cy="65" r="3" fill="#38bdf8" opacity="0.5" />
    <circle cx="850" cy="80" r="3" fill="#38bdf8" opacity="0.2" />
    
    <text x="830" y="350" fill="#475569" font-size="10" font-family="monospace" letter-spacing="1" transform="rotate(-90, 830, 350)">SYS.TOLERANCE.CTRL</text>
</svg>